name: Build Native Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install SDK Tools and NDK
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --install "build-tools;33.0.1" "platforms;android-33" "ndk;25.1.8937393"

    - name: Generate local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Build APK with Gradle 8.5
      run: |
        if [ -f ./gradlew ]; then chmod +x gradlew; fi
        gradle assembleDebug --stacktrace || ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
